<!doctype html>
<!--
  Reel 1080x1920 "Lo que te diría tu contador": un caso con números contado con tipografía cinética sobre papel crema,
  con voz en off. Referencias: el formato de caso de @nogarpa_ y el estilo tipográfico (palabras que entran de a una,
  texto que se vuelve barras, marco con rayos) que Seba aprobó el 06/11/2026.
  Datos en window.PIEZA (lo escribe la skill paquete-diario; ver .claude/skills/paquete-diario/reel-explicado.md):
    {escenas: [{tipo, voz, ...}], TIEMPOS?: [[inicio, duración], ...]}
  Tipos: texto · barras · ticket · cifra · lista · cierre. TIEMPOS lo calcula scripts/voz-reel.py según lo que dura la
  voz; sin él, cada escena usa su duración base (DUR). En los textos, *palabra* va en violeta.
  Lo exporta scripts/render-animada.mjs (30 fps, con la mezcla de voz y música).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel explicado</title>
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/300.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/500.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/montserrat/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/patrick-hand/400.css">
<style>
  :root{--deep:#0F1A30;--fondo:#F3EEE2;--papel:#FBF8F1;--azul:#1F3A7A;--vio:#892CA0;--mostaza:#E9B949;--terra:#C8643B;--verde:#2E9E6B}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--fondo)}
  body{font-family:'Montserrat',sans-serif;color:var(--deep)}
  .tex{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;mix-blend-mode:multiply}
  .sc{position:absolute;inset:0;opacity:0}
  .col{position:absolute;left:90px;right:90px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
  .cen{align-items:center;text-align:center}
  b.v{color:var(--vio);font-weight:inherit}
  /* tipografía cinética: pesado + liviano, como la referencia */
  .w9{font-weight:900;text-transform:uppercase;line-height:.98;letter-spacing:-.01em}
  .w3{font-weight:300;text-transform:uppercase;line-height:1;letter-spacing:-.01em}
  .xl{font-size:150px} .lg{font-size:118px} .md{font-size:84px} .sm{font-size:56px}
  .w9.vio,.w3.vio{color:var(--vio)}
  .mano{font-family:'Patrick Hand',cursive;font-size:58px;color:var(--terra)}
  .hl{position:relative;display:inline-block;padding:0 16px;z-index:0}
  .hl::before{content:"";position:absolute;inset:6px 0 2px;background:var(--mostaza);z-index:-1;transform-origin:left;transform:scaleX(var(--s,1))}
  /* barras: el texto "se condensa" antes de cambiar de escena */
  .barras{display:flex;flex-direction:column;gap:34px;align-items:center}
  .barras i{display:block;height:58px;background:var(--deep);border-radius:4px}
  .barras i.m{background:var(--mostaza)}
  /* ticket */
  .ticket{background:var(--papel);width:820px;padding:56px 60px 70px;box-shadow:0 30px 70px rgba(15,26,48,.18);position:relative;
          font-weight:500;font-size:40px;border-radius:10px 10px 0 0}
  .ticket::after{content:"";position:absolute;left:0;right:0;bottom:-28px;height:28px;
          background:linear-gradient(-45deg,transparent 14px,var(--papel) 0) 0 0/40px 28px repeat-x,linear-gradient(45deg,transparent 14px,var(--papel) 0) 0 0/40px 28px repeat-x}
  .ticket h4{font-weight:900;font-size:36px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding-bottom:26px;border-bottom:4px dashed rgba(15,26,48,.35);margin-bottom:24px}
  .fila{display:flex;justify-content:space-between;gap:30px;padding:14px 0;text-align:left}
  .fila b{font-weight:900;white-space:nowrap}
  .fila.menos b{color:var(--terra)}
  .fila.mas b{color:var(--verde)}
  .fila.sub{border-top:3px solid var(--deep);margin-top:8px;padding-top:22px}
  .fila.por{font-family:'Patrick Hand',cursive;font-size:50px;color:var(--vio)}
  .total{margin-top:26px;background:var(--deep);color:#fff;border-radius:16px;padding:26px 34px;display:flex;justify-content:space-between;align-items:center;gap:20px}
  .total span{font-weight:700;font-size:34px;letter-spacing:.08em;text-transform:uppercase;text-align:left}
  .total b{font-weight:900;font-size:62px;color:var(--mostaza);white-space:nowrap}
  .nota{font-weight:500;font-size:30px;opacity:.7;margin-top:56px;text-align:center}
  /* rayos + tarjeta */
  .rayos{position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px}
  .marco{position:relative;background:var(--deep);color:#fff;border-radius:44px;padding:90px 70px;width:800px;text-align:center;
         box-shadow:0 0 0 14px var(--fondo),0 0 0 22px var(--deep),0 40px 80px rgba(15,26,48,.3)}
  .marco .big{font-weight:900;font-size:130px;color:var(--mostaza);line-height:1;white-space:nowrap}
  .marco .chico{font-weight:700;font-size:46px;margin-top:24px;line-height:1.2}
  /* lista */
  .lista{margin-top:60px;display:flex;flex-direction:column;gap:30px}
  .item{display:flex;align-items:center;gap:34px;background:var(--papel);border-radius:22px;padding:30px 40px;box-shadow:0 18px 40px rgba(15,26,48,.12)}
  .item .x{flex:0 0 76px;height:76px;border-radius:50%;background:var(--terra);display:flex;align-items:center;justify-content:center}
  .item .x.ok{background:var(--verde)}
  .item span{font-weight:900;font-size:56px;line-height:1.05;text-transform:uppercase}
  /* cierre */
  .wpp{margin-top:70px;display:flex;align-items:center;gap:26px;background:var(--deep);color:#fff;border-radius:999px;padding:30px 54px;text-align:left}
  .wpp b{font-weight:900;font-size:52px}
  .pie{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
  /* animaciones (las arranca el script en el segundo que corresponde) */
  @keyframes vis{from,to{opacity:1}}
  @keyframes sube{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  @keyframes golpe{0%{opacity:0;transform:scale(1.5)}60%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}
  @keyframes resalta{from{--s:0}to{--s:1}}
  @keyframes barra{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes papel{0%{opacity:0;transform:translateY(500px) rotate(4deg)}75%{opacity:1;transform:translateY(-14px) rotate(-1deg)}100%{opacity:1;transform:rotate(-1.2deg)}}
  @keyframes gira{from{transform:rotate(0) scale(.6)}to{transform:rotate(25deg) scale(1)}}
  @keyframes tacha{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
  @property --s{syntax:'<number>';inherits:false;initial-value:1}
</style>
</head>
<body>
<img class="tex" src="../assets/textura-papel.png" alt="">
<div id="reel"></div>
<script>
(function(){
  // Ejemplo (el caso que aprobó Seba): ¿en blanco o facturando?
  const P = window.PIEZA || {escenas: [
    {tipo: "texto", lineas: [{t: "¿Te pagan"}, {t: "$1.500.000", tam: "xl", hl: true}, {t: "por mes?", peso: 3}], mano: "— te ofrecen un trabajo nuevo", voz: "Te ofrecen un trabajo de un millón y medio por mes."},
    {tipo: "texto", lineas: [{t: "¿En blanco", tam: "xl"}, {t: "o", peso: 3}, {t: "facturando?", tam: "xl", color: "vio"}], voz: "¿Qué te conviene: en blanco o facturando?"},
    {tipo: "texto", centro: true, lineas: [{t: "Lo que te diría", peso: 3, tam: "md"}, {t: "tu contador", hl: true}], voz: "Hagamos la cuenta, como tu contador."},
    {tipo: "barras"},
    {tipo: "ticket", arriba: "Opción 1 · *en blanco*", titulo: "Relación de dependencia", filas: [["Sueldo bruto", "$1.500.000"], ["Aportes (17%)", "−$255.000", "menos"], ["Te queda", "$1.245.000", "sub"], ["× 13 sueldos", "con aguinaldo", "por"]], total: ["En el año", "$16.185.000"], voz: "En blanco te descuentan el diecisiete por ciento. Con aguinaldo son trece sueldos: dieciséis millones al año."},
    {tipo: "ticket", arriba: "Opción 2 · *facturando*", titulo: "Monotributo · categoría C", filas: [["Facturás", "$1.500.000"], ["Cuota mensual", "−$66.020", "menos"], ["Te queda", "$1.433.980", "sub"], ["× 12 meses", "sin aguinaldo", "por"]], total: ["En el año", "$17.207.759"], nota: "Servicios, valores vigentes desde el 1/8/2026. Sin Ingresos Brutos.", voz: "Facturando, sos categoría C: unos sesenta y seis mil por mes. En doce meses, diecisiete millones doscientos mil."},
    {tipo: "cifra", numero: "+$1.022.759", texto: "al año a favor del monotributo", mano: "¿listo, entonces?", voz: "Un millón más por año para el monotributo. ¿Listo, entonces?"},
    {tipo: "lista", titulo: "Pero…", bajada: "facturando no tenés:", items: ["Aguinaldo", "Vacaciones pagas", "Indemnización", "ART"], voz: "No tan rápido. Facturando no tenés aguinaldo, ni vacaciones pagas, ni indemnización, ni ART."},
    {tipo: "texto", lineas: [{t: "Si es un solo cliente", peso: 3, tam: "md"}, {t: "y con horario fijo,", peso: 3, tam: "md"}, {t: "ojo:", hl: true}, {t: "puede ser un empleo *encubierto.*", tam: "md"}], voz: "Y si trabajás para un solo cliente, con horario fijo, ojo: puede ser un empleo encubierto."},
    {tipo: "cierre", arriba: "La cuenta no es", abajo: "solo el número.", boton: "La hacemos con tus datos", voz: "La cuenta no es solo el número. Escribinos y la hacemos con tus datos."},
  ]};
  const DUR = {texto: 3.2, barras: 0.8, ticket: 7, cifra: 4, lista: 6.5, cierre: 4.5};   // duración base (igual en voz-reel.py)
  const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const mark = s => esc(s).replace(/\*(.+?)\*/g, '<b class="v">$1</b>');
  const X = ok => `<div class="x ${ok ? "ok" : ""}"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">${ok ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M6 6l12 12M18 6L6 18"/>'}</svg></div>`;
  const WAPP = `<svg width="64" height="64" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#25D366"/><path fill="#fff" d="M16 7.2a8.7 8.7 0 0 0-7.5 13.1L7.3 24.8l4.6-1.2A8.7 8.7 0 1 0 16 7.2zm5.1 12.2c-.2.6-1.2 1.2-1.7 1.2-.4.1-1 .1-1.6-.1a14 14 0 0 1-1.5-.6 11.6 11.6 0 0 1-4.4-3.9c-.3-.5-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1 1 2 1.3 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>`;
  const RAYOS = (() => { let l = ""; for (let i = 0; i < 36; i++) { const a = i * 10 * Math.PI / 180;
      l += `<line x1="${750+Math.cos(a)*470}" y1="${750+Math.sin(a)*470}" x2="${750+Math.cos(a)*(i%2?640:720)}" y2="${750+Math.sin(a)*(i%2?640:720)}"/>`; }
    return l; })();

  // Cada tipo devuelve su HTML; a(anim, seg) marca cuándo entra cada elemento, en segundos desde el inicio de la escena.
  // d = duración real de la escena (con la voz), para repartir las entradas a lo largo de lo que se va diciendo.
  // Los momentos de los "pops" (total del ticket, cifra, botón) tienen que coincidir con POPS en voz-reel.py.
  const a = (anim, t, dur) => `class="a" data-a="${anim}" data-t="${t}"${dur ? ` data-d="${dur}"` : ""}`;
  const hl = (t, txt) => `<span class="hl" data-a="resalta" data-t="${t + .35}" data-d=".35">${txt}</span>`;
  const TIPOS = {
    texto(e, d) {
      const ls = e.lineas || [], paso = Math.min(.6, (d - 1.2) / Math.max(1, ls.length));
      return `<div class="col ${e.centro ? "cen" : ""}">${ls.map((l, i) => {
        const t = .1 + i * paso, peso = l.peso == 3 ? "w3" : "w9", tam = l.tam || "lg";
        const txt = l.hl ? hl(t, mark(l.t)) : mark(l.t);
        return `<div ${a("golpe", t)} data-c="${peso} ${tam} ${l.color === "vio" ? "vio" : ""}">${txt}</div>`;
      }).join("")}${e.mano ? `<div ${a("sube", Math.min(d - .8, .4 + ls.length * paso))} data-c="mano" style="margin-top:40px">${esc(e.mano)}</div>` : ""}</div>`;
    },
    barras() {
      return `<div class="col cen"><div class="barras">${[820, 640, 780, 520].map((w, i) =>
        `<i ${a("barra", i * .06)} data-c="${i === 3 ? "m" : ""}" style="width:${w}px;transform-origin:${i % 2 ? "right" : "left"}"></i>`).join("")}</div></div>`;
    },
    ticket(e, d) {
      const fs = e.filas || [], tTot = Math.max(1.6, d - 1.5), paso = (tTot - .9) / Math.max(1, fs.length);
      return `<div class="col cen">${e.arriba ? `<div ${a("sube", .05)} data-c="w9 sm" style="margin-bottom:50px">${mark(e.arriba)}</div>` : ""}
        <div ${a("papel", .2, .7)} data-c="ticket"><h4>${esc(e.titulo)}</h4>
          ${fs.map(([x, y, cls], i) => `<div ${a("sube", .9 + i * paso)} data-c="fila ${cls || ""}"><span>${esc(x)}</span><b>${esc(y)}</b></div>`).join("")}
          ${e.total ? `<div ${a("pop", tTot)} data-c="total"><span>${esc(e.total[0])}</span><b>${esc(e.total[1])}</b></div>` : ""}
        </div>${e.nota ? `<div ${a("sube", tTot + .5)} data-c="nota">${esc(e.nota)}</div>` : ""}</div>`;
    },
    cifra(e, d) {
      return `<div class="col cen"><svg ${a("gira", 0, d)} data-c="rayos" viewBox="0 0 1500 1500" stroke="#0F1A30" stroke-width="16" stroke-linecap="round">${RAYOS}</svg>
        <div ${a("pop", .15, .55)} data-c="marco"><div class="big">${esc(e.numero)}</div><div class="chico">${mark(e.texto)}</div></div>
        ${e.mano ? `<div ${a("sube", Math.min(d - .8, 1.6))} data-c="mano" style="margin-top:80px;position:relative">${esc(e.mano)}</div>` : ""}</div>`;
    },
    lista(e, d) {
      const its = e.items || [], paso = Math.min(.85, (d - 1.6) / Math.max(1, its.length));
      return `<div class="col"><div ${a("golpe", .1)} data-c="w9 xl">${mark(e.titulo)}</div>
        ${e.bajada ? `<div ${a("sube", .6)} data-c="w3 sm" style="margin-top:14px">${mark(e.bajada)}</div>` : ""}
        <div class="lista">${its.map((s, i) => `<div ${a("tacha", 1.2 + i * paso)} data-c="item">${X(e.marca === "check")}<span>${esc(s)}</span></div>`).join("")}</div></div>`;
    },
    cierre(e) {
      return `<div class="col cen"><div ${a("sube", .1)} data-c="w3 md">${mark(e.arriba)}</div><div ${a("golpe", .5)} data-c="w9 lg">${mark(e.abajo)}</div>
        <div ${a("pop", .9)} data-c="wpp">${WAPP}<div><div style="font-weight:700;font-size:32px">${esc(e.boton || "Escribinos por WhatsApp")}</div><b>+54 11 4992-2513</b></div></div>
        <img ${a("sube", 1.6)} src="../assets/logo/ierlip-logo-color.png" style="width:520px;margin-top:90px"></div>`;
    },
  };

  const E = P.escenas || [];
  let T = P.TIEMPOS || window.TIEMPOS;
  if (!T) { let t = 0; T = E.map(e => { const d = e.dur || DUR[e.tipo] || 3; const r = [t, d]; t += d; return r; }); }
  const R = document.getElementById("reel");
  R.innerHTML = E.map((e, i) => `<div class="sc" style="animation:vis ${T[i][1]}s linear ${T[i][0]}s 1 none">${(TIPOS[e.tipo] || TIPOS.texto)(e, T[i][1])}</div>`).join("")
    + `<div class="pie">Estudio IERLIP · ${esc(P.pie || "lo que te diría tu contador")}</div>`;
  R.querySelectorAll(".sc").forEach((sc, i) => sc.querySelectorAll("[data-a]").forEach(el => {
    if (el.dataset.c) el.setAttribute("class", ((el.getAttribute("class") || "") + " " + el.dataset.c).trim());
    const t = T[i][0] + Number(el.dataset.t), d = Number(el.dataset.d || .45);
    const ease = el.dataset.a === "gira" ? "linear" : el.dataset.a === "resalta" ? "ease-out" : "cubic-bezier(.2,.9,.3,1.1)";
    el.style.animation = `${el.dataset.a} ${d}s ${ease} ${t}s 1 both`;
  }));
  // Achica lo que no entra a lo ancho (las palabras largas en mayúscula).
  document.fonts.ready.then(() => R.querySelectorAll(".w9,.w3,.big,.total b").forEach(el => {
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 2 && fs > 30) { fs -= 4; el.style.fontSize = fs + "px"; }
  }));
  window.__READY = true;
})();
</script>
</body>
</html>
