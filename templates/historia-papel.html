<!DOCTYPE html>
<!--
  Estilo B · Papel oscuro · historia 1080x1920 (9:16). Lo renderiza scripts/render.mjs.
  Aprobado en Design el 27/10/2026 (referencia: "novedades de hoy · 20/10/2026").
  window.PIEZA = {
    eyebrow: "recordatorio · 05/11/2026",          // manuscrito mostaza
    titulo: "Monotributo: vence el *20/11*",        // *x* = resaltado terracota
    texto: "opcional, 1-2 líneas en blanco",
    tarjetas: [{t:"Vence el viernes 20/11", d:"La cuota mensual vence..."}],   // hasta 4; con sticker_zone, hasta 2
    sticker_zone: true                              // deja espacio vacío para el sticker nativo de Instagram
  }
-->
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource/source-serif-4/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/source-serif-4/800.css">
<link rel="stylesheet" href="../node_modules/@fontsource/source-serif-4/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/patrick-hand/400.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{position:relative;background:#0F1A30;color:#0F1A30;font-family:'Source Serif 4',serif}
  .deco,.tex{position:absolute;left:0;top:0;width:1080px;height:1920px}
  .tex{object-fit:cover;pointer-events:none}
  .wave{display:block;width:100%}
  em{font-style:normal;background:linear-gradient(transparent 66%, rgba(200,100,59,.6) 66%)}
  .safe{position:absolute;left:90px;right:90px;top:190px;bottom:330px;display:flex;flex-direction:column;gap:22px}
  .safe.centro{justify-content:center}
  .safe.pocas h1{font-size:124px} .safe.pocas h1.m{font-size:110px} .safe.pocas h1.s{font-size:94px}
  .safe.pocas .card h3{font-size:60px} .safe.pocas .card p{font-size:38px} .safe.pocas .texto{font-size:52px}
  h1{font-weight:900;font-size:108px;line-height:1.04;letter-spacing:-.01em;color:#fff}
  h1.m{font-size:94px} h1.s{font-size:80px}
  .texto{font-weight:700;font-size:44px;line-height:1.3;color:#E2E8F0}
  .cards{display:flex;flex-direction:column;gap:30px;margin-top:40px}
  .card{position:relative;background:#F7F3EA;border-radius:6px;padding:40px 44px 38px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
  .tape{position:absolute;top:-18px;width:130px;height:34px;background:rgba(233,185,73,.75)}
  .card h3{font-weight:800;font-size:50px;line-height:1.1}
  .card p{font-weight:700;font-size:32px;line-height:1.32;margin-top:16px;color:#1D2A44}
  .zone{flex:1 1 auto;min-height:380px}
  .logo{position:absolute;left:0;right:0;bottom:110px;display:flex;justify-content:center}
  .logo div{background:#fff;border-radius:999px;padding:18px 46px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
  .logo img{height:92px;display:block}
</style>
</head>
<body>
<svg class="deco" viewBox="0 0 1080 1920">
  <path d="M560 -80 C 780 40, 980 140, 1160 380" fill="none" stroke="#1F3A7A" stroke-width="170"/>
  <path d="M690 -60 C 880 50, 1020 150, 1170 300" fill="none" stroke="#E9B949" stroke-width="56"/>
  <path d="M-120 1180 C 200 1030, 520 1060, 760 1180" fill="none" stroke="#892CA0" stroke-width="150"/>
  <circle cx="1180" cy="1880" r="330" fill="none" stroke="#892CA0" stroke-width="130"/>
  <circle cx="1180" cy="1880" r="200" fill="none" stroke="#C8643B" stroke-width="60"/>
</svg>
<img class="tex" src="../assets/textura-papel-oscuro.png" alt="">
<div class="safe" id="safe"></div>
<div class="logo"><div><img src="../assets/logo/ierlip-logo-color.png" alt=""></div></div>
<script>
(function(){
  const P = window.PIEZA || {eyebrow:"recordatorio · 05/11/2026", titulo:"Monotributo: vence el *20/11*", tarjetas:[{t:"Pagalo con VEP o débito", d:"Generá el VEP desde la web de ARCA."}]};
  const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const mark = s => esc(s).replace(/\*(.+?)\*/g,"<em>$1</em>");
  const wave = (c,h) => `<svg class="wave" style="height:${h}px" viewBox="0 0 600 16" preserveAspectRatio="none"><path d="M0 8 Q 15 0 30 8 T 60 8 T 90 8 T 120 8 T 150 8 T 180 8 T 210 8 T 240 8 T 270 8 T 300 8 T 330 8 T 360 8 T 390 8 T 420 8 T 450 8 T 480 8 T 510 8 T 540 8 T 570 8 T 600 8" fill="none" stroke="${c}" stroke-width="3"/></svg>`;
  const len = (P.titulo || "").replace(/\*/g,"").length;
  const size = len > 55 ? "s" : len > 34 ? "m" : "";
  const max = P.sticker_zone ? 2 : 4;
  const cards = (P.tarjetas || []).slice(0,max).map((c,i) => `<div class="card"><div class="tape" style="${i % 2 ? "right" : "left"}:40px;transform:rotate(${i % 2 ? 3 : -3}deg)"></div>
      <div style="display:inline-flex;flex-direction:column;gap:2px"><h3>${mark(c.t)}</h3>${wave("#C8643B",12)}</div>${c.d ? `<p>${mark(c.d)}</p>` : ""}</div>`).join("");
  const S = document.getElementById("safe");
  const n = Math.min((P.tarjetas || []).length, max);
  if (n <= 2) S.classList.add("pocas");
  if (!P.sticker_zone) S.classList.add("centro");
  S.innerHTML =
    (P.eyebrow ? `<div style="align-self:flex-start;display:flex;flex-direction:column;gap:2px"><div style="font-family:'Patrick Hand',cursive;font-size:50px;color:#E9B949">${esc(P.eyebrow)}</div>${wave("#E9B949",16)}</div>` : "") +
    `<h1 class="${size}">${mark(P.titulo)}</h1>` +
    (P.texto ? `<div class="texto">${mark(P.texto)}</div>` : "") +
    (cards ? `<div class="cards">${cards}</div>` : "") +
    (P.sticker_zone ? `<div class="zone"></div>` : "");
  window.__READY = true;
})();
</script>
</body>
</html>
